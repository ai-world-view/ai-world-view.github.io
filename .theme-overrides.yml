# =============================================================================
# .theme-overrides.yml — declare which theme files this site intentionally forks
# =============================================================================
#
# Copy to the ROOT of a consumer repo.
#
# scripts/bin/audit-consumer (in the theme repo) classifies every file you keep
# that also exists in the theme:
#
#   IDENTICAL            byte-for-byte the same as the theme's copy
#                        → delete it; the theme's version will be used
#   DIFFERS_JUSTIFIED    differs AND is listed below → intentional, no action
#   DIFFERS_UNJUSTIFIED  differs and is NOT listed below → flagged for review;
#                        `--strict` exits non-zero
#   UNIQUE               exists only here → your own file, ignored
#
# Without this file every shadowed file reads as unjustified drift. it-journey
# shadows ~55 theme files, so an audit there currently reports 55 problems and
# is useless. Declaring the deliberate ones turns the audit into a short,
# actionable list — the ones you forgot you forked.
#
# Keep the `reason` current. An override whose reason has been fixed upstream is
# the signal to delete the fork and take the theme's version back.
#
# Usage from a theme checkout:
#   ./scripts/bin/audit-consumer --consumer-path /path/to/site
#   ./scripts/bin/audit-consumer --consumer-path /path/to/site --strict   # CI
#   ./scripts/bin/audit-consumer --consumer-path /path/to/site --fix      # drop IDENTICAL
# =============================================================================
#
# ai-world-view.github.io forks NO theme file today (checked 2026-09-14 against
# zer0-mistakes origin/main 4349ea17, by path and by bytes): the repo has no
# _layouts/, _includes/, _sass/ or assets/ directory at all — every layout,
# include, stylesheet and script arrives over remote_theme (CLAUDE.md: "Don't
# add theme files").
#
#   * 404.html differs from the theme repo's root 404.html, but that file is the
#     theme's own docs-site page: remote_theme never ships it, so it is this
#     site's page, not an override (audit-consumer scans only _layouts,
#     _includes, _sass, assets/css and assets/js).
#
# Theme bugs go upstream to bamr87/zer0-mistakes, never patched around here, so
# a new entry needs a reason AND an upstream issue; delete the fork once
# upstream fixes it.
# =============================================================================

overrides: []
