# fleet.manifest.yml — this repository's AI fleet, in the
# shared 'fleet/v1' vocabulary. See docs/FLEET-SPEC.md in
# bamr87/wtd. Generated by `wtd fleet adopt`; edit freely —
# hand-written values survive regeneration of other fields.
spec_version: fleet/v1
repo: ai-world-view/ai-world-view.github.io
provenance: derived
summary: Org-hub growth engine (orchestrate -> grow/plant-lineage, armed by ORCHESTRATE_ENABLED) plus PR-time reviewers and a daily credential probe; _data/fleet_pause.yml is the in-tree emergency stop for every lane.
lanes:
- id: ai-content-review
  kind: review
  harness: claude-cli
  implementation: .github/workflows/ai-content-review.yml
  description: AI Content Review
  triggers:
  - kind: event
    events:
    - pull_request
  - kind: dispatch
  switch: AI_CONTENT_REVIEW_ENABLED  # an OFF switch, not an arming one: on while unset; "false" stops the model tier only
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  guardrails:
    never_merges: true
    opens_pull_requests: false
- id: framework-pr-reviewer
  kind: review
  harness: claude-cli
  implementation: .github/workflows/framework-pr-reviewer.yml
  description: Framework PR Review
  triggers:
  - kind: event
    events:
    - pull_request
  - kind: dispatch
  switch: FRAMEWORK_PR_REVIEWER_ENABLED  # an OFF switch, not an arming one: on while unset; "false" stops the model pass only
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  guardrails:
    never_merges: true
    opens_pull_requests: false
- id: grow-lineage
  kind: content
  harness: claude-code-action
  implementation: .github/workflows/grow-lineage.yml
  description: Grow Lineage
  triggers:
  - kind: dispatch
  switch: ORCHESTRATE_ENABLED  # enforced on orchestrate.yml, this lane's only automated dispatcher
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  - LIFECYCLE_PAT
  guardrails:
    never_merges: true
    opens_pull_requests: false
    writes_directly_to_default_branch: true
- id: plant-lineage
  kind: content
  harness: claude-code-action
  implementation: .github/workflows/plant-lineage.yml
  description: Plant Lineage
  triggers:
  - kind: dispatch
  switch: ORCHESTRATE_ENABLED  # auto-spawn is dispatched by orchestrate.yml; manual path keeps the two-key confirm
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  - LIFECYCLE_PAT
  guardrails:
    never_merges: true
    opens_pull_requests: false
    writes_directly_to_default_branch: true
- id: secret-expiry-watch
  kind: maintenance
  harness: claude-code-action
  implementation: .github/workflows/secret-expiry-watch.yml
  description: Secret Expiry Watch
  triggers:
  - kind: schedule
    cron: 5 5 * * *
  - kind: dispatch
  switch: SECRET_EXPIRY_WATCH_ENABLED
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  - LIFECYCLE_PAT
  guardrails:
    never_merges: true
    opens_pull_requests: false
tokens:
- name: ANTHROPIC_API_KEY
  scope: fleet
  required: false
  purpose: Claude auth by API key, taken in the order the CLAUDE_AUTH_ORDER repository variable names (unset = after the OAuth token).
  used_by:
  - ai-content-review
  - framework-pr-reviewer
  - grow-lineage
  - plant-lineage
  - secret-expiry-watch
- name: CLAUDE_CODE_OAUTH_TOKEN
  scope: fleet
  required: true
  purpose: 'Preferred Claude auth (house convention: OAuth first). Produced by 
`claude setup-token`.'
  used_by:
  - ai-content-review
  - framework-pr-reviewer
  - grow-lineage
  - plant-lineage
  - secret-expiry-watch
- name: LIFECYCLE_PAT
  scope: repo
  required: true
  used_by:
  - grow-lineage
  - plant-lineage
  - secret-expiry-watch
agents:
- content-reviewer

